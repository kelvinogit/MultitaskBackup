services:
  - type: web
    name: multitaskbackup
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn MultiWorking.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"