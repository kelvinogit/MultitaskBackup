version: "1"
services:
- type: web
  name: multitaskbackup
  runtime: python
  repo: https://github.com/kelvinogit/MultitaskBackup
  plan: free
  envVars:
  - key: DEBUG
    sync: false
  - key: SECRET_KEY
    sync: false
  region: oregon
  buildCommand: ./build.sh
  startCommand: python -m gunicorn MultiWorking.asgi:application -k uvicorn.workers.UvicornWorker
  autoDeployTrigger: commit
